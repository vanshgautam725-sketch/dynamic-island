name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unpack Everything Smartly
        run: |
          echo "=== FILES BEFORE UNZIP ==="
          ls -la
          mkdir -p unpacked
          find . -maxdepth 2 -name "*.zip" -exec unzip -o {} -d ./unpacked \;
          
          # Find where package.json is hiding inside unpacked
          PKG_PATH=$(find ./unpacked -name "package.json" | head -n 1)
          if [ -n "$PKG_PATH" ]; then
            PKG_DIR=$(dirname "$PKG_PATH")
            echo "Found files in: $PKG_DIR"
            cp -r $PKG_DIR/* .
          fi
          
          echo "=== FILES AFTER UNPACKING ==="
          ls -la

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Ensure app.json
        run: |
          if [ ! -f app.json ]; then
            echo '{"expo":{"name":"Dynamic Island","slug":"dynamic-island","version":"1.0.0","android":{"package":"com.veletify.dynamicisland","permissions":["SYSTEM_ALERT_WINDOW","FOREGROUND_SERVICE"]}}}' > app.json
          fi

      - name: Generate Android Folder
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Compile Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-Island-APK
          path: android/app/build/outputs/apk/debug/*.apk
